name: Deploy Firebase Hosting

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: client
      - name: Build frontend
        run: npm run build
        working-directory: client
      - name: Test customer data handling
        run: npm test
        working-directory: client
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Firestore staff permissions with local emulators
        run: npx --yes firebase-tools@14 emulators:exec --project demo-smart-gym --config firebase.emulator.json --only auth,firestore "npm run test:emulator"
        working-directory: client
      - name: Deploy live site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMART_GYM_TEAM2 }}'
          projectId: smart-gym-team2
          channelId: live
          entryPoint: client
